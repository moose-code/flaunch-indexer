  totalCreatorFeesETH: BigDecimal!
  ispEthIn: BigInt!
  ispTokenOut: BigInt!
  liquidity: BigInt!
  tickSpacing: Int!
  fairLaunchedEnded: Boolean!
  feeAllocation_id: String
