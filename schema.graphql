# Flaunch Protocol Schema - Envio HyperIndex
# Converted from TheGraph subgraph format

# Enum for activity types
enum ActivityType {
  Buy
  Sell
}

# Global configuration
type Config {
  id: String!
  locked: Boolean!
  lockerPaused: Boolean!
  collectionCount: BigInt!
  volumeETH: BigInt!
  volumeUSDC: BigDecimal!
  totalUsers: BigInt!
  totalFeesETH: BigInt!
  totalFeesUSDC: BigDecimal!
  feeCalculator: String!
  protocolFeeRecipient: String!
  feeDistribution_id: String!
  latestReferralEscrow: String!
  staleTimeWindow: BigInt!
}

# User entity
type User {
  id: String!
  # Virtual fields via @derivedFrom - accessed at query time only
  # Note: aggregates is 1-to-1 so accessed via UserAggregate.user_id query
  holdings: [CollectionTokenHolding!]! @derivedFrom(field: "user_id")
  ownedNFTs: [Collection!]! @derivedFrom(field: "owner_id")
  createdNFTs: [Collection!]! @derivedFrom(field: "creator_id")
  referrerFees: [ReferrerFee!]! @derivedFrom(field: "recipient_id")
}

type UserAggregate {
  id: String!
  totalReferrerFeesETH: BigInt!
  user_id: String!
}

type TokenReferralFee {
  id: String!
  totalAmount: BigInt!
  collectionToken_id: String
  isFleth: Boolean!
  user_id: String!
}

# ERC20 token holding for a user
type CollectionTokenHolding {
  id: String!
  collectionToken_id: String!
  user_id: String!
  balance: BigInt!
  balanceBefore: BigInt!
  createdTx: String!
  createdTimestamp: BigInt!
  updatedTx: String!
  updatedTimestamp: BigInt!
  lastUpdatedTimestamp: BigInt!
  price: BigInt!
  # poolSwaps derived at query time via PoolSwap.userHolding_id
}

type CollectionTokenHoldingChange {
  id: String!
  collectionToken_id: String!
  owner_id: String!
  counterpartEOA: String!
  balanceAfter: BigInt!
  balanceBefore: BigInt!
  priceBefore: BigInt!
  priceAfter: BigInt!
  isIncrement: Boolean!
  createdTx: String!
  created: BigInt!
}

# ERC721 holding for a user
type CollectionHolding {
  id: String!
  nftAddress: String!
  tokenId: BigInt!
  owner_id: String!
}

# Lookup table: NFT address -> CollectionToken
type NFTLookup {
  id: String!
  collectionToken_id: String!
}

# Lookup table: PoolId -> CollectionToken
type PoolCollectionLookup {
  id: String!
  collectionToken_id: String!
}

# Treasury Manager Implementation tracking
type TreasuryManagerImplementation {
  id: String!
  approvedAt: BigInt
  unapprovedAt: BigInt
}

# Revenue Manager (implements TreasuryManager interface - flattened)
type RevenueManager {
  id: String!
  deployer: String!
  managerImplementation: String!
  permissions: String!
  createdAt: BigInt!
  owner_id: String
  protocolFeeRecipient_id: String
  protocolFee: BigInt
  # Virtual derived fields
  holdings: [Collection!]! @derivedFrom(field: "revenueManager_id")
  claims: [RevenueManagerClaim!]! @derivedFrom(field: "revenueManager_id")
}

type RevenueManagerClaim {
  id: String!
  revenueManager_id: String!
  isProtocol: Boolean!
  collection_id: String
  amount: BigInt!
  amountUSDC: BigDecimal!
  recipient_id: String!
  timestamp: BigInt!
  txHash: String!
}

# Address Fee Split Manager
type AddressFeeSplitManager {
  id: String!
  deployer: String!
  managerImplementation: String!
  permissions: String!
  createdAt: BigInt!
  owner_id: String
  creatorShare: BigInt
  externalManagerETHTotal: BigInt!
  # Virtual derived fields
  holdings: [Collection!]! @derivedFrom(field: "addressFeeSplitManager_id")
  recipients: [AddressFeeSplitManagerRecipient!]! @derivedFrom(field: "manager_id")
  claims: [AddressFeeSplitManagerClaim!]! @derivedFrom(field: "manager_id")
  externalManagerETH: [AddressFeeSplitManagerExternalETH!]! @derivedFrom(field: "manager_id")
}

type AddressFeeSplitManagerRecipient {
  id: String!
  manager_id: String!
  recipient: String!
  recipientShare: BigInt!
}

type AddressFeeSplitManagerClaim {
  id: String!
  manager_id: String!
  amount: BigInt!
  amountUSDC: BigDecimal!
  recipient_id: String!
  timestamp: BigInt!
  txHash: String!
}

type AddressFeeSplitManagerExternalETH {
  id: String!
  manager_id: String!
  user_id: String!
  amount: BigInt!
  amountUSDC: BigDecimal!
  createdAt: BigInt!
  txHash: String!
}

# Staking Manager
type StakingManager {
  id: String!
  deployer: String!
  managerImplementation: String!
  permissions: String!
  createdAt: BigInt!
  owner_id: String
  stakingToken_id: String!
  minEscrowDuration: BigInt!
  minStakeDuration: BigInt!
  creatorShare: BigInt!
  ownerShare: BigInt!
  totalStaked: BigInt!
  totalStakers: BigInt!
  externalManagerETHTotal: BigInt!
  # Virtual derived fields
  holdings: [Collection!]! @derivedFrom(field: "stakingManager_id")
  stakes: [StakingManagerStake!]! @derivedFrom(field: "manager_id")
  stakesDeltas: [StakingManagerStakeDelta!]! @derivedFrom(field: "manager_id")
  claims: [StakingManagerClaim!]! @derivedFrom(field: "manager_id")
  escrows: [StakingManagerEscrow!]! @derivedFrom(field: "manager_id")
  externalManagerETH: [StakingManagerExternalETH!]! @derivedFrom(field: "manager_id")
}

type StakingManagerStake {
  id: String!
  manager_id: String!
  user_id: String!
  amount: BigInt!
  unlocksAt: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
  deltas: [StakingManagerStakeDelta!]! @derivedFrom(field: "stake_id")
}

type StakingManagerStakeDelta {
  id: String!
  manager_id: String!
  user_id: String!
  stake_id: String!
  amount: BigInt!
  createdAt: BigInt!
  txHash: String!
}

type StakingManagerEscrow {
  id: String!
  manager_id: String!
  collection_id: String!
  timelockedUntil: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
  txHash: String!
}

type StakingManagerClaim {
  id: String!
  manager_id: String!
  amount: BigInt!
  amountUSDC: BigDecimal!
  recipient_id: String!
  createdAt: BigInt!
  txHash: String!
}

type StakingManagerExternalETH {
  id: String!
  manager_id: String!
  user_id: String!
  amount: BigInt!
  amountUSDC: BigDecimal!
  createdAt: BigInt!
  txHash: String!
}

# BuyBack Manager
type BuyBackManager {
  id: String!
  deployer: String!
  managerImplementation: String!
  permissions: String!
  createdAt: BigInt!
  owner_id: String
  creatorShare: BigInt!
  ownerShare: BigInt!
  buyBackCurrency0: String!
  buyBackCurrency1: String!
  totalDeposits: BigInt!
  totalDepositsUSDC: BigDecimal!
  externalManagerETHTotal: BigInt!
  # Virtual derived fields
  holdings: [Collection!]! @derivedFrom(field: "buyBackManager_id")
  deposits: [BuyBackManagerDeposit!]! @derivedFrom(field: "manager_id")
  claims: [BuyBackManagerClaim!]! @derivedFrom(field: "manager_id")
  externalManagerETH: [BuyBackManagerExternalETH!]! @derivedFrom(field: "manager_id")
}

type BuyBackManagerDeposit {
  id: String!
  manager_id: String!
  amount: BigInt!
  amountUSDC: BigDecimal!
  createdAt: BigInt!
  txHash: String!
}

type BuyBackManagerClaim {
  id: String!
  manager_id: String!
  collection_id: String
  amount: BigInt!
  amountUSDC: BigDecimal!
  recipient_id: String!
  createdAt: BigInt!
  txHash: String!
}

type BuyBackManagerExternalETH {
  id: String!
  manager_id: String!
  user_id: String!
  amount: BigInt!
  amountUSDC: BigDecimal!
  createdAt: BigInt!
  txHash: String!
}

# ERC721 Collection (NFT representing token ownership)
type Collection {
  id: String!
  creator_id: String!
  owner_id: String!
  contract: String!
  collectionToken_id: String
  tokenID: BigInt!
  name: String!
  symbol: String!
  # Manager references - only one will be set
  managerType: String
  managerUpdatedAt: BigInt!
  revenueManager_id: String
  addressFeeSplitManager_id: String
  stakingManager_id: String
  buyBackManager_id: String
}

# Metadata for collection token (from IPFS)
type CollectionMetadata {
  id: String!
  name: String!
  description: String!
  logoHash: String!
  symbol: String!
  collectionToken_id: String
  website: String
  discord: String
  twitter: String
  telegram: String
}

# ERC20 Collection Token
type CollectionToken {
  id: String!
  collection_id: String!
  totalSupply: BigInt!
  pool_id: String!
  name: String!
  symbol: String!
  decimals: Int!
  baseURI: String!
  metadata_id: String
  createdAt: BigInt!
  creator_id: String!
  isNative: Boolean!
  owner_id: String!
  marketCapETH: BigInt!
  volumeETH: BigInt!
  marketCapUSDC: BigDecimal!
  volumeUSDC: BigDecimal!
  totalFeesETH: BigInt!
  totalFeesUSDC: BigDecimal!
  derivedETH: BigInt!
  totalCommunityFeesETH: BigDecimal!
  totalCreatorFeesETH: BigDecimal!
  tokenPrice: BigInt!
  totalHolders: BigInt!
  creationFee: BigInt!
  fairLaunch_id: String
  # Archive helper fields
  lastMinuteArchived: BigInt!
  lastHourArchived: BigInt!
  lastFifteenMinuteArchived: BigInt!
  lastFourHourArchived: BigInt!
  lastMinuteRecorded: BigInt!
  lastHourRecorded: BigInt!
  lastFifteenMinuteRecorded: BigInt!
  lastFourHourRecorded: BigInt!
  # Virtual derived fields
  dayData: [TokenDayData!]! @derivedFrom(field: "token_id")
  hourData: [TokenHourData!]! @derivedFrom(field: "token_id")
  minuteData: [TokenMinuteData!]! @derivedFrom(field: "token_id")
  fifteenMinuteData: [Token15MinuteData!]! @derivedFrom(field: "token_id")
  fourHourData: [Token4HourData!]! @derivedFrom(field: "token_id")
  holdings: [CollectionTokenHolding!]! @derivedFrom(field: "collectionToken_id")
  # Note: importedToken is 1-to-1 so accessed via ImportedToken.collectionToken_id query
}

# BidWall entity
type BidWall {
  id: String!
  contract: String!
  collectionToken_id: String!
  pool_id: String!
  initialized: Boolean!
  tickLower: BigInt!
  tickUpper: BigInt!
  amount: BigInt!
  balance: BigInt!
  deployedETH: BigInt!
  closed: Boolean!
  distributions: [BidWallDistribution!]! @derivedFrom(field: "bidWall_id")
}

type BidWallDistribution {
  id: String!
  bidWall_id: String!
  collectionToken_id: String!
  amount: BigInt!
  recipient_id: String!
}

type BidWallRepositioned {
  id: String!
  pool_id: String!
  _eth: BigInt!
  _tickLower: Int!
  _tickUpper: Int!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

# Fair Launch
type FairLaunch {
  id: String!
  active: Boolean!
  collectionToken_id: String!
  tick: Int!
  initialSupply: BigInt!
  ethEarned: BigInt!
  soldInitialSupply: BigInt!
  starts_at: BigInt!
  ends_at: BigInt!
}

# Fee Distribution configuration
type FeeDistribution {
  id: String!
  swapFee: Int
  referrer: Int
  protocol: Int
  community: Int
  active: Boolean
  creator: Int
}

type FeeExemption {
  id: String!
  flatFee: Int!
}

type FlaunchFeeExemption {
  id: String!
  createdAt: BigInt!
}

type PoolPremine {
  id: String!
  receiver_id: String!
  pool_id: String!
  amount: BigInt!
}

type FlayBurner {
  id: String!
  address: String!
  pendingETH: BigInt!
  totalBurned: BigInt!
  createdAt: BigInt!
}

# Referral Escrow entities
type ReferralEscrowAssigned {
  id: String!
