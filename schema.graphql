  fairLaunchFee1: BigInt
  ispFee0: BigInt
  ispFee1: BigInt
  uniswapFee0: BigInt
  uniswapFee1: BigInt
  flAmountUSDC: BigDecimal
  ispAmountUSDC: BigDecimal
  uniAmountUSDC: BigDecimal
